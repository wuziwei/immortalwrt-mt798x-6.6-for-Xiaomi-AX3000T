# 4K IPTV & High-Throughput Network Buffers
# UDP 核心缓冲区与内存池扩容（消灭 udpxy 4K 组播 74,024 溢出丢包与微卡顿）
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
net.core.rmem_default = 2097152
net.core.wmem_default = 2097152
net.ipv4.udp_mem = 16384 32768 65536
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.core.netdev_max_backlog = 10000

# MTK 硬件加速与 4K IPTV 超低时延平滑传输（保持原生 cubic 拥塞控制，防止 Wi-Fi 空口突发积压卡顿）
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = cubic
net.ipv4.tcp_rmem = 4096 87380 8388608
net.ipv4.tcp_wmem = 4096 65536 8388608

# 桥接流量绕过 Netfilter（减轻高码率 25Mbps IPTV 组播流的 Conntrack 连接跟踪负担，消除 CPU 抖动）
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0

# ZRAM 与低内存（256MB RAM）虚拟内存调度优化
vm.page-cluster = 0
vm.swappiness = 90
vm.vfs_cache_pressure = 120
vm.watermark_boost_factor = 0
