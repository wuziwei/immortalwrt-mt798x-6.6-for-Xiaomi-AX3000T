name: Update Checker

on:
  workflow_dispatch:
    inputs:
      force_build_singbox:
        description: '强制重新编译 Sing-Box 核心'
        required: false
        type: boolean
        default: false
      force_build_firmware:
        description: '强制重新构建 AX3000T 固件'
        required: false
        type: boolean
        default: false
  schedule:
    # 每周一上午 11:00 (UTC 03:00) 自动定时巡检
    - cron: '0 3 * * 1'

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  UPSTREAM_BRANCH: openwrt-24.10-6.6

jobs:
  # ==========================================
  # 任务 1: 检查并编译发布 Sing-Box 独立核心
  # ==========================================
  check-singbox:
    name: 检查并发布 Sing-Box 核心
    runs-on: ubuntu-latest
    outputs:
      singbox_updated: ${{ steps.check_version.outputs.need_build }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查 upstream 最新 Sing-Box 标签
        id: check_version
        run: |
          LATEST_TAG=$(curl -sSL "https://api.github.com/repos/SagerNet/sing-box/releases" | jq -r '.[0].tag_name')
          echo "Upstream 最新版本: $LATEST_TAG"
          
          CURRENT_TAG=$(grep -oE 'git clone --depth 1 -b [^ ]+' diy-part2.sh | awk '{print $5}' || echo "unknown")
          echo "仓库当前版本: $CURRENT_TAG"
          
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          
          if [ "$LATEST_TAG" != "$CURRENT_TAG" ] || [ "${{ github.event.inputs.force_build_singbox }}" == "true" ]; then
            echo "need_build=true" >> $GITHUB_OUTPUT
          else
            echo "need_build=false" >> $GITHUB_OUTPUT
            echo "当前 Sing-Box 核心已经是最新 ($CURRENT_TAG)，无需重复编译。"
          fi

      - name: 配置 Go 1.23 编译环境
        if: steps.check_version.outputs.need_build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: 编译定制轻量 sing-box 核心 (Linux ARM64)
        if: steps.check_version.outputs.need_build == 'true'
        run: |
          TAG="${{ steps.check_version.outputs.latest_tag }}"
          echo "==> 克隆 sing-box $TAG..."
          git clone --depth 1 -b "$TAG" https://github.com/SagerNet/sing-box.git /tmp/sing-box-src
          
          cd /tmp/sing-box-src
          echo "==> 正在使用专属核心标签编译 (quic + wireguard + clash_api + tailscale)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -tags "with_quic,with_wireguard,with_clash_api,with_tailscale" \
            -trimpath \
            -ldflags "-s -w -buildid=" \
            -o "$GITHUB_WORKSPACE/sing-box" \
            ./cmd/sing-box
          cd "$GITHUB_WORKSPACE"
          
          chmod +x sing-box
          tar -czvf "sing-box-${TAG}-linux-arm64.tar.gz" sing-box
          sha256sum sing-box "sing-box-${TAG}-linux-arm64.tar.gz" > sha256sum.txt

      - name: 同步更新 diy-part2.sh 源码版本
        if: steps.check_version.outputs.need_build == 'true'
        run: |
          TAG="${{ steps.check_version.outputs.latest_tag }}"
          sed -i -E "s|git clone --depth 1 -b [^ ]+ https://github.com/SagerNet/sing-box.git|git clone --depth 1 -b ${TAG} https://github.com/SagerNet/sing-box.git|g" diy-part2.sh
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add diy-part2.sh
          git commit -m "chore(sing-box): 自动升级核心到 ${TAG}" || echo "No changes to commit"
          git push origin main || echo "Git push skipped"

      - name: 发布单独的 Sing-Box 核心 Release
        if: steps.check_version.outputs.need_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "sing-box-${{ steps.check_version.outputs.latest_tag }}"
          name: "Sing-Box 专属核心 ${{ steps.check_version.outputs.latest_tag }} (小米 AX3000T)"
          body: |
            ### 小米 AX3000T (MT7981) 专属定制 sing-box 核心
            - **版本**：`${{ steps.check_version.outputs.latest_tag }}`
            - **架构**：`linux/arm64`（静态链接，CGO 禁用，零系统依赖）
            - **特性**：`with_quic, with_wireguard, with_clash_api, with_tailscale`
            - **防崩优化**：原生 Linux TUN 栈，去除了 gVisor 内存泄漏。
            
            #### 路由器一键无损热更新：
            ```bash
            curl -fsSL -o /tmp/sing-box "https://github.com/${{ github.repository }}/releases/download/sing-box-${{ steps.check_version.outputs.latest_tag }}/sing-box" && chmod +x /tmp/sing-box && cp /tmp/sing-box /usr/bin/sing-box && /etc/init.d/momo restart
            ```
          files: |
            sing-box
            sing-box-${{ steps.check_version.outputs.latest_tag }}-linux-arm64.tar.gz
            sha256sum.txt

  # ==========================================
  # 任务 2: 检查 OpenWrt 上游更新并联动构建
  # ==========================================
  check-openwrt:
    name: 检查 ImmortalWrt 上游更新
    runs-on: ubuntu-latest
    needs: check-singbox
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 获取上游 Commit Hash
        id: getHash
        run: |
          git clone --depth 1 $UPSTREAM_URL -b $UPSTREAM_BRANCH /tmp/upstream
          cd /tmp/upstream
          echo "commitHash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: 比对上游 Commit
        id: checkHash
        run: |
          [ -f .commitHash ] && savedHash=$(cat .commitHash) || savedHash=""
          echo "上次保存 Hash: $savedHash"
          echo "最新上游 Hash: ${{ steps.getHash.outputs.commitHash }}"
          
          if [ "$savedHash" != "${{ steps.getHash.outputs.commitHash }}" ]; then
            echo "${{ steps.getHash.outputs.commitHash }}" > .commitHash
            echo "updated=true" >> $GITHUB_OUTPUT
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .commitHash
            git commit -m "chore(openwrt): 更新上游 commitHash" || echo "No changes"
            git push origin main || echo "Git push skipped"
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: 触发固件自动构建
        if: |
          steps.checkHash.outputs.updated == 'true' || 
          needs.check-singbox.outputs.singbox_updated == 'true' || 
          github.event.inputs.force_build_firmware == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log("检测到更新，正在触发 build-ax3000t.yml 固件构建...");
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-ax3000t.yml',
              ref: context.ref
            });
